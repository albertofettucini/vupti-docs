<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Vupti icon — concept "V up" (owner picked 2026-09-20: the V of Vupti whose right arm keeps going up
    and ends in an arrow, the flick itself). A lively lavender field, the app's own colour family, so the
    icon carries on a home screen and still belongs to the app. White mark, no text, no phone drawn.
    Palette: lavender #A78BFA → violet #6D28D9 (diagonal), mark #FFFFFF.
    The mark is centred on its own bounding box and 15% larger than the first pass (owner, 2026-09-20),
    and stays clear of the corner mask iOS applies.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- a whisper of light from the top left, so the field is not flat -->
    <radialGradient id="glow" cx="28%" cy="20%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#field)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 500) scale(1.15) translate(24.5 44.5)">
    <!-- the V, its right arm turning up -->
    <path d="M -235 -235 L -35 195 L 150 -175 L 150 -245" fill="none" stroke="#FFFFFF"
          stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the arrow head that finishes the flick -->
    <path d="M 150 -330 L 232 -232 L 68 -232 Z" fill="#FFFFFF"/>
  </g>
</svg>
